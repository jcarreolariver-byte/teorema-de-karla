<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050710"><meta name="description" content="Una demostración imposible para Karla."><title>El teorema de Karla</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap');
:root{color-scheme:dark;font-family:'DM Sans',sans-serif;background:#050710;color:#f5eee7}*{box-sizing:border-box}body{margin:0}button{font:inherit}canvas{position:fixed;inset:0;width:100vw;height:100dvh;touch-action:pan-y}#grain{pointer-events:none;position:fixed;inset:0;opacity:.12;background:radial-gradient(ellipse at center,transparent 30%,#000 100%)}main{min-height:100svh;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;padding:74px 25px 82px;pointer-events:none}.panel{width:min(100%,600px);animation:in .8s both;pointer-events:auto}.intro{text-align:center}.eyebrow{font-size:10px;font-weight:600;letter-spacing:.23em;color:#d4ae7c;text-transform:uppercase;line-height:1.6}.sigil{font-size:52px;margin:50px 0 17px;color:#e7c69f}h1,h2{font-family:'Playfair Display',Georgia,serif;font-weight:400;letter-spacing:-.035em}h1{font-size:clamp(48px,11vw,76px);line-height:1.08;margin:0}h1 em{color:#e5c498;font-weight:400}h2{font-size:clamp(38px,8vw,62px);margin:28px 0 24px;line-height:1.15}p{line-height:1.62}.subtitle{font:italic 18px 'Playfair Display',serif;color:#d3c6b9;margin:24px 0 47px}.btn{cursor:pointer;border:1px solid #a48b69;border-radius:999px;background:rgba(25,28,37,.7);color:#faeee0;padding:14px 25px;min-height:47px;backdrop-filter:blur(8px);transition:background .2s;max-width:100%}.btn:hover,.btn:focus-visible{background:#493729;outline-offset:3px}.btn:active{transform:scale(.98)}.btn span{padding-left:16px;color:#eac58e}.fine{display:block;color:#92969c;font-size:11px;margin-top:20px}.top{display:flex;justify-content:space-between;align-items:start;gap:15px}.progress{color:#929ba8;font-size:11px;white-space:nowrap}.story{min-height:180px}.story p{font:clamp(18px,4.6vw,23px)/1.59 'Playfair Display',Georgia,serif;color:#e5e0dd;margin:0 0 16px;animation:in .6s both}.story p.gold{color:#ecc69e;font-style:italic}.action{margin-top:26px}.hint{color:#969ba4;font-size:11px;letter-spacing:.04em;margin:18px 0}.wishBtn{padding:10px 18px;font-size:12px}.wishes{display:flex;flex-direction:column;gap:8px;margin-top:15px}.wishes span{font:italic 16px 'Playfair Display',serif;color:#e6c59d;animation:in .6s both}.conclusion{border-left:1px solid #e4bd86;padding-left:16px;margin-top:22px;animation:in 1.4s both}.math{font:23px Georgia,serif;color:#f1d2ab}.conclusion p{font:italic clamp(21px,5vw,29px)/1.35 'Playfair Display',serif;color:#f5d9b7;margin:20px 0}.conclusion strong{font-size:12px;letter-spacing:.1em;color:#d9bc91}.secret{font:italic 15px 'Playfair Display',serif;color:#e4c28f;margin-top:15px}.footer{position:fixed;z-index:2;bottom:16px;width:100%;font-size:9px;letter-spacing:.13em;text-align:center;color:#96949a;pointer-events:none;padding:0 15px}#audio{position:fixed;z-index:4;right:14px;top:max(13px,env(safe-area-inset-top));font-size:11px;padding:9px 14px;min-height:38px}#audio[hidden]{display:none}.touchhint{position:fixed;bottom:48px;left:50%;transform:translateX(-50%);width:80%;z-index:2;text-align:center;color:#a7a4aa;font-size:10px;pointer-events:none}.hide{display:none!important}@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.panel,.story p,.wishes span,.conclusion{animation:none!important}.btn{transition:none}}@media(min-width:700px){main{padding:75px 35px 90px}}@media(max-height:700px){main{align-items:flex-start;padding-top:80px}.sigil{margin:18px 0}.subtitle{margin-bottom:28px}}
</style></head>
<body><canvas id="sky" aria-hidden="true"></canvas><div id="grain"></div><button id="audio" class="btn" hidden aria-label="Silenciar música">♫ Silenciar</button><main><section id="panel" class="panel intro" aria-live="polite"></section></main><div class="footer">UNA VERDAD PEQUEÑA EN UN UNIVERSO INMENSO</div><audio id="soundtrack" src="audio/score.mp3" loop preload="none"></audio>
<script>
const gift={name:'Karla',nickname:'Jockey',closing:'Que nunca te alcance el olvido, mi eterna casualidad.',wishes:['Que la vida sea generosa contigo.','Que nunca te falten motivos para reír.','Que tus sueños encuentren caminos.','Que seas libre de ser tú.','Que encuentres una felicidad muy tuya.'],chapters:[
{label:'I · HIPÓTESIS',heading:'Todo comenzó mucho antes',lines:['Se calcula que el universo tiene unos 13 800 millones de años.','Ha tenido tiempo de encender estrellas, inventar planetas y producir gente que pierde las llaves dentro de su propia casa.','Mi interés por todas estas cuestiones comenzó bastante después.'],hint:'Toca el cielo y observa qué ocurre.'},
{label:'II · CONDICIONES INICIALES',heading:'Una pequeña diferencia',lines:['Bastaba un minuto. Una calle. Un mensaje que pudo no haberse enviado.','En los sistemas caóticos, una diferencia diminuta puede cambiar el recorrido entero.','Y sin embargo, entre tantas trayectorias posibles, hubo una que me llevó a encontrarte.','Se supone que el experimento estudia a Karla. Aunque el universo insiste en registrar otra variable: Jockey.'],hint:'Desliza tu dedo para alterar las trayectorias.'},
{label:'III · LO INCONMENSURABLE',heading:'Un problema de medida',lines:['Existen infinitos de distintos tamaños. Los matemáticos han logrado explicarlo sin perder completamente la cabeza.','Yo sigo buscando una unidad razonable para medir lo mucho que te quiero.','He probado con distancias astronómicas. Ninguna parece servir.'],hint:'Descubre los cinco deseos que viven aquí.'},
{label:'IV · DEMOSTRACIÓN',heading:'El teorema de Karla',lines:['He intentado encontrar una verdad que pudiera regalarte para siempre.','Y terminé construyendo este pequeño universo.','Para ti. Por ti.','Porque te quiero muchísimo.','Y porque, entre todos los futuros posibles, deseo que encuentres uno en el que seas inmensamente feliz.','Feliz cumpleaños, Karla.'],hint:'La demostración puede repetirse tantas veces como quieras.'}
]};
const panel=document.getElementById('panel'),audioBtn=document.getElementById('audio'),track=document.getElementById('soundtrack');let started=false,chapter=0,revealed=0,wishes=[],muted=false,audioContext=null,oscillators=[],gain=null;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){if(!started){panel.className='panel intro';panel.innerHTML='<div class="eyebrow">18 de octubre · un experimento improbable</div><div class="sigil">∴</div><h1>El teorema<br><em>de Karla</em></h1><p class="subtitle">Sobre la improbable geometría de encontrarse.</p><button class="btn" id="start">Iniciar demostración <span>↗</span></button><small class="fine">Se recomienda activar el sonido · Usa audífonos si puedes</small>';document.getElementById('start').onclick=()=>{started=true;audioBtn.hidden=false;startMusic();render()};return}let c=gift.chapters[chapter];panel.className='panel';panel.innerHTML='<div class="top"><div class="eyebrow">'+esc(c.label)+'</div><div class="progress">'+String(chapter+1).padStart(2,'0')+' / 04</div></div><h2>'+esc(c.heading)+'</h2><div class="story">'+c.lines.slice(0,revealed+1).map((line,i)=>'<p class="'+(chapter===3&&i===3?'gold':'')+'">'+esc(line)+'</p>').join('')+'</div>'+(chapter===2?'<div><button class="btn wishBtn" id="wish">✧ Descubrir un deseo ('+wishes.length+'/5)</button><div class="wishes">'+wishes.map(x=>'<span>✦ '+esc(x)+'</span>').join('')+'</div></div>':'')+(chapter===3&&revealed===c.lines.length-1?'<div class="conclusion"><div class="math">∃ K : K = Karla</div><p>'+esc(gift.closing)+'</p><strong>∎ QUEDA DEMOSTRADO.</strong></div>':'')+'<div class="action"><p class="hint">'+esc(c.hint)+'</p><button id="next" class="btn">'+(revealed<c.lines.length-1?'Continuar':chapter===3?'Volver al principio':'Siguiente capítulo')+' <span>→</span></button></div>';document.getElementById('next').onclick=()=>{if(revealed<c.lines.length-1)revealed++;else if(chapter<3){chapter++;revealed=0}else{chapter=0;revealed=0;wishes=[]}render();scrollTo({top:0,behavior:reduced?'instant':'smooth'})};let wb=document.getElementById('wish');if(wb)wb.onclick=()=>{if(wishes.length<gift.wishes.length){wishes.push(gift.wishes[wishes.length]);render()}}}
function ambient(){try{audioContext=new(window.AudioContext||window.webkitAudioContext)();gain=audioContext.createGain();gain.gain.value=.018;gain.connect(audioContext.destination);[130.81,196,261.63,392].forEach((freq,i)=>{const o=audioContext.createOscillator();o.type='sine';o.frequency.value=freq;o.connect(gain);o.start();oscillators.push(o)});}catch(e){}}
function startMusic(){track.volume=.33;track.play().then(()=>{}).catch(()=>{ambient()});track.addEventListener('error',()=>{if(!audioContext&&!muted)ambient()},{once:true})}
audioBtn.onclick=()=>{muted=!muted;audioBtn.textContent=muted?'♫ Activar música':'♫ Silenciar';audioBtn.setAttribute('aria-label',muted?'Activar música':'Silenciar música');if(muted){track.pause();if(audioContext)audioContext.suspend()}else if(track.error){if(!audioContext)ambient();else audioContext.resume()}else{track.play().catch(()=>{if(audioContext)audioContext.resume();else ambient()})}};
const canvas=document.getElementById('sky'),ctx=canvas.getContext('2d');let w=0,h=0,dpr=1,stars=[],t=0,pointer={x:0,y:0};function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=Math.floor(w*dpr);canvas.height=Math.floor(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:Math.min(210,Math.floor(w*h/1900))},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.5+.25,p:Math.random()*6.28}))}addEventListener('resize',resize);resize();addEventListener('pointermove',e=>{pointer.x=e.clientX;pointer.y=e.clientY},{passive:true});
function sky(){t+=reduced?.002:.009;const gr=ctx.createRadialGradient(w*.52,h*.37,0,w*.5,h*.4,Math.max(w,h)*.8);gr.addColorStop(0,chapter===3&&started?'#241d2b':'#101a2c');gr.addColorStop(1,'#03050c');ctx.fillStyle=gr;ctx.fillRect(0,0,w,h);stars.forEach(s=>{let a=.26+.5*(.5+.5*Math.sin(t+s.p)),x=s.x+Math.sin(t+s.p)*3+pointer.x*s.r/280,y=s.y+pointer.y*s.r/350;ctx.beginPath();ctx.fillStyle='rgba(227,221,206,'+a+')';ctx.arc(x,y,s.r,0,Math.PI*2);ctx.fill()});if(started&&chapter===1){ctx.lineWidth=.7;ctx.strokeStyle='rgba(210,182,139,.23)';for(let i=0;i<8;i++){ctx.beginPath();for(let j=0;j<=85;j++){const x=j*w/85,y=h*(.25+i*.068)+Math.sin(j*.09+t+i*.8+pointer.x/180)*18;j?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke()}}if(started&&chapter===3){const cx=w*.50,cy=h*.36,scale=Math.min(w,h)*.19;const pts=[[-.65,-1],[-.65,-.5],[-.65,0],[-.65,.5],[-.65,1],[.6,-1],[.28,-.68],[-.08,-.32],[-.65,.08],[-.08,.32],[.28,.68],[.6,1]];const lines=[[0,1],[1,2],[2,3],[3,4],[5,6],[6,7],[7,8],[8,9],[9,10],[10,11]];ctx.strokeStyle='rgba(243,201,145,.72)';ctx.shadowColor='#f7d19a';ctx.shadowBlur=12;ctx.lineWidth=1.4;for(const [a,b] of lines){ctx.beginPath();ctx.moveTo(cx+pts[a][0]*scale,cy+pts[a][1]*scale);ctx.lineTo(cx+pts[b][0]*scale,cy+pts[b][1]*scale);ctx.stroke()}pts.forEach(([x,y],i)=>{ctx.beginPath();ctx.fillStyle=i===8?'#fff8e8':'#f4d2a0';ctx.arc(cx+x*scale,cy+y*scale,i===8?3.4:2.2,0,2*Math.PI);ctx.fill()});ctx.shadowBlur=0}requestAnimationFrame(sky)}sky();render();
</script></body></html>
